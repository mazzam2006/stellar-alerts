name: Continuous Integration
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmdm "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'num'

      - name: Install Dependencies
        run: npm ci

      - name: Verify generated OpenAPI types are up to date
        run: npm run generate:types:check

      - name: Build Shared Package (@stellar-alerts/shared)
        run: nx tsc -p packages/shared/tsconfig.json

      - name: Typecheck Backend (apps/api)
        run: nx tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck Frontend (apps/web)
        run: nx tsc -p apps/web/tsconfig.json --noEmit

      - name: Run API Unit Tests
        run: npm run test:api

      - name: Run Web Lint
        run: npm run lint --workspace=web

      - name: Run Web Unit Tests
        run: npm run test --workspace=web

      - name: Build Web Application
        run: npm run build --workspace=web
        env:
          NEXTAUTH_SECRET: "ci-build-dummy-secret-key-123456"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
